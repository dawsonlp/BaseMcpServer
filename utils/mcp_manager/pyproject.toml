[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-manager"
version = "1.8.0"
description = "Comprehensive manager for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Larry Dawson", email = "larry.dawson@gmail.com"},
]
dependencies = [
    "typer>=0.27.2",           # CLI framework
    "pydantic>=2.13.5",       # Data validation
    "rich>=15.0.0",           # Rich text and formatting
    "pyyaml>=6.0.3",          # YAML parsing
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
mcp-manager = "mcp_manager.cli:app"
mcpmanager = "mcp_manager.cli:app"  # Backward compatibility alias

[tool.setuptools]
packages = [
    "mcp_manager",
    "mcp_manager.cli", 
    "mcp_manager.cli.commands",
    "mcp_manager.cli.common",
    "mcp_manager.core",
]
package-dir = {"" = "src"}
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
