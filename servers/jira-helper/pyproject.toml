[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-helper"
version = "2.3.1"
description = "A Jira and Confluence helper MCP server"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "MCP Server Team", email = "example@example.com"},
]
dependencies = [
    # Core MCP
    "mcp>=2.2.0,<3.0.0",
    "pydantic>=2.13.5,<3.0.0",
    
    # Jira/Confluence integration 
    "atlassian-python-api>=5.0.5",
    
    # Configuration
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    
    # Graph visualization
    "matplotlib>=3.11.2",
    "networkx>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
jira-helper = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "tool_config", "jira_client", "exceptions", "output_sanitizer", "mcp_adapters", "runtime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
