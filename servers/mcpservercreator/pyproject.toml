[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpservercreator"
version = "1.4.0"
description = "MCP Server Creator - Dynamically creates and installs MCP servers with automatic Cline registration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "MCP Server Team", email = "example@example.com"},
]
dependencies = [
    "mcp==2.0.0rc1",
    "pydantic-settings>=2.13.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
mcpservercreator = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "server", "tool_config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
prerelease = "allow"
